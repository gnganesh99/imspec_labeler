name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # run manually to pick up new commits of the SciFiReaders fork

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheels (SciFiReaders fork + pure-Python deps)
        run: python tools/build_wheels.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html app.js tools.js modes.js dataset.js worker.js py vendor wheels _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
